<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GBA">
  <title>GBA</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/src/styles/base.css">
  <link rel="stylesheet" href="/src/styles/play.css">
</head>
<body class="play-page">
  <div class="play-ambient" aria-hidden="true"></div>

  <div class="app" id="app" data-touch="auto">
    <header class="bar">
      <a class="icon-btn" id="back" href="/gba" aria-label="Back to library"></a>
      <div class="bar-title">
        <strong id="title">Loading</strong>
        <span class="bar-status" id="status" aria-live="polite"></span>
      </div>
      <div class="bar-actions">
        <button class="icon-btn" id="save-btn" type="button" aria-label="Save state" title="Save state (Ctrl+S)" disabled></button>
        <button class="icon-btn" id="help-btn" type="button" aria-label="Controls" title="Controls (?)"></button>
        <button class="icon-btn" id="menu-btn" type="button" aria-label="More" title="More (Esc)"></button>
      </div>
    </header>

    <main class="stage" id="stage">
      <div class="screen" id="screen">
        <canvas id="canvas" width="240" height="160"></canvas>
        <div class="flash" id="flash"></div>
        <div class="ff-badge" id="ff-badge" hidden>2×</div>

        <div class="overlay" id="loading">
          <p class="ov-title" id="loading-title">Loading</p>
          <div class="meter"><i id="meter-fill"></i></div>
          <p class="ov-sub num" id="loading-label">Starting the emulator</p>
        </div>
        <button class="overlay ov-start" id="start" type="button" hidden>
          <span class="ov-title">Press any button</span>
          <span class="ov-sub">or tap the screen to start</span>
        </button>
        <button class="overlay ov-paused" id="paused" type="button" hidden>
          <span class="ov-icon" id="paused-icon"></span>
          <span class="ov-title">Paused</span>
          <span class="ov-sub">Tap to keep playing</span>
        </button>
        <div class="overlay ov-error" id="error" hidden>
          <p class="ov-title" id="error-title">Couldn’t start this game</p>
          <p class="ov-sub" id="error-label"></p>
          <div class="ov-actions">
            <button class="btn primary small" type="button" id="retry">Try again</button>
            <a class="btn ghost small" id="error-back" href="/gba">Library</a>
          </div>
        </div>
      </div>
    </main>

    <!-- on-screen controls -->
    <div class="pad-shoulder pad-l" data-zone="btn" data-btn="L"><span>L</span><kbd>A</kbd></div>
    <div class="pad-shoulder pad-r" data-zone="btn" data-btn="R"><span>R</span><kbd>S</kbd></div>

    <div class="pad-dpad-zone" data-zone="dpad" aria-label="D-pad">
      <div class="dpad" id="dpad">
        <i class="arm arm-v"></i><i class="arm arm-h"></i>
        <i class="tri up" data-btn="Up"></i><i class="tri down" data-btn="Down"></i>
        <i class="tri left" data-btn="Left"></i><i class="tri right" data-btn="Right"></i>
        <i class="dimple"></i>
      </div>
    </div>

    <div class="pad-face-zone" data-zone="face" aria-label="A and B buttons">
      <div class="face">
        <div class="fbtn fb-b" data-btn="B"><span>B</span><kbd>X</kbd></div>
        <div class="fbtn fb-a" data-btn="A"><span>A</span><kbd>Z</kbd></div>
      </div>
    </div>

    <div class="pad-sys">
      <div class="sbtn" data-zone="btn" data-btn="Select"><i></i><span>Select</span></div>
      <div class="sbtn" data-zone="btn" data-btn="Start"><i></i><span>Start</span></div>
      <button class="ff" id="ff" type="button" aria-pressed="false" aria-label="Fast forward 2×" title="Fast forward (F, or hold Space)">
        <span class="ff-icon"></span><span class="num">2×</span>
      </button>
    </div>
  </div>

  <dialog class="sheet" id="menu-sheet" aria-labelledby="menu-title"></dialog>
  <dialog class="sheet" id="help-sheet" aria-labelledby="help-title"></dialog>
  <dialog class="sheet" id="cheat-sheet" aria-labelledby="cheat-title"></dialog>

  <script type="module" src="/src/play.js"></script>
</body>
</html>
