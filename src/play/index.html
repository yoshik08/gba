<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GBA Play</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #emulator-container {
            flex: 1;
            position: relative;
            background-color: #000;
        }
        #canvas {
            display: block;
            margin: 0 auto;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #controls {
            display: none;
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
        }
        .control-btn {
            background: rgba(0,0,0,0.5);
            border: none;
            color: white;
            padding: 10px 20px;
            margin: 0 5px;
            border-radius: 4px;
            cursor: pointer;
        }
        .control-btn:hover {
            background: rgba(0,0,0,0.7);
        }
        #menu {
            display: none;
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.8);
            padding: 10px;
            border-radius: 4px;
            z-index: 10;
        }
        #menu button {
            display: block;
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #menu button:hover {
            background: #3367d6;
        }
    </style>
</head>
<body>
    <div id="emulator-container">
        <canvas id="canvas"></canvas>
        <div id="controls">
            <button class="control-btn" id="save-state">Save State</button>
            <button class="control-btn" id="load-state">Load State</button>
            <button class="control-btn" id="fast-forward">Fast Forward</button>
        </div>
        <div id="menu">
            <h3>Menu</h3>
            <button id="menu-close">Close</button>
            <button id="menu-save-state">Save State</button>
            <button id="menu-load-state">Load State</button>
            <button id="menu-fast-forward-toggle">Toggle Fast Forward</button>
            <button id="menu-back">Back to Library</button>
        </div>
    </div>
    <script type="module" src="/src/play/main.js"></script>
</body>
</html>
