<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GBA Library</title>
  <link rel="stylesheet" href="/src/theme.css">
  <style>
    body { padding: 20px 16px 40px; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    h1 { font-size: 1.4rem; margin: 0; letter-spacing: 0.04em; }
    .user {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .btn {
      background: var(--accent);
      color: #0b0b10;
      border: 0;
      border-radius: 999px;
      padding: 10px 16px;
      font-weight: 600;
    }
    .btn.ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    #signed-out, #signed-in { display: none; }
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
    }
    .game-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow);
      cursor: pointer;
    }
    .cover {
      aspect-ratio: 1 / 1;
      background: linear-gradient(160deg, #242436, #121218);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
      padding: 8px;
    }
    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .game-card h3 {
      margin: 0;
      padding: 10px;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .empty, .error { color: var(--muted); }
    .center {
      min-height: 60vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <header>
    <h1>GBA</h1>
    <div class="user">
      <span id="user-name"></span>
      <button id="sign-out" class="btn ghost" type="button">Sign out</button>
    </div>
  </header>
  <div id="signed-out" class="center">
    <button id="login-button" class="btn" type="button">Sign in with Google</button>
  </div>
  <div id="signed-in">
    <div id="grid"></div>
  </div>
  <script type="module" src="/src/library.js"></script>
</body>
</html>
