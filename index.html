<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Your Game Boy Advance library, streamed from Google Drive and saved to the cloud.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GBA">
  <title>GBA</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/src/styles/base.css">
  <link rel="stylesheet" href="/src/styles/library.css">
</head>
<body class="library-page">
  <div class="ambient" aria-hidden="true"><i></i><i></i></div>

  <header class="top" id="top">
    <a class="wordmark" href="/gba" aria-label="GBA library">GBA</a>
    <div class="top-actions" id="top-actions" hidden>
      <button class="sync" id="sync" type="button" data-state="syncing">
        <span class="sync-dot" aria-hidden="true"></span>
        <span class="sync-label" id="sync-label">Syncing with Drive</span>
      </button>
      <button class="account" id="account" type="button" aria-haspopup="dialog" aria-label="Account and settings">
        <span class="avatar" id="avatar"></span>
      </button>
    </div>
  </header>

  <main id="main">
    <!-- signed out -->
    <section class="welcome" id="signed-out" hidden>
      <div class="welcome-screen" aria-hidden="true">
        <div class="lcd lcd-boot">
          <canvas id="boot-canvas"></canvas>
        </div>
      </div>
      <div class="welcome-copy">
        <h1 class="welcome-title" id="welcome-title">Your Game Boy Advance library, in any browser.</h1>
        <p class="welcome-sub">Games stream from your Google Drive. Saves follow you to every device, and downloaded games keep working offline.</p>
        <div class="welcome-actions">
          <button id="login-button" class="btn primary" type="button"></button>
        </div>
      </div>
    </section>

    <!-- signed in -->
    <section id="signed-in" hidden>
      <section class="hero" id="hero" hidden></section>

      <section class="shelf" id="recent" hidden>
        <div class="section-head"><h2>Recently played</h2></div>
        <div class="shelf-row" id="recent-row"></div>
      </section>

      <section class="library" id="library">
        <div class="lib-head">
          <div class="lib-title">
            <h2>Library</h2>
            <span class="lib-count num" id="lib-count"></span>
          </div>
          <div class="lib-tools">
            <label class="search">
              <span class="search-icon" id="search-icon"></span>
              <input id="search" type="search" placeholder="Search games" autocomplete="off" spellcheck="false" enterkeyhint="search" aria-label="Search games">
              <kbd class="search-kbd" aria-hidden="true">/</kbd>
            </label>
            <div class="seg" id="filters" role="tablist" aria-label="Filter games">
              <button role="tab" type="button" data-filter="all" aria-selected="true">All</button>
              <button role="tab" type="button" data-filter="recent" aria-selected="false">Played</button>
              <button role="tab" type="button" data-filter="saves" aria-selected="false">Saves</button>
              <button role="tab" type="button" data-filter="offline" aria-selected="false">Offline</button>
              <span class="seg-thumb" aria-hidden="true"></span>
            </div>
          </div>
        </div>
        <div class="grid" id="grid" aria-live="polite"></div>
        <div class="empty" id="empty" hidden></div>
      </section>
    </section>
  </main>

  <dialog class="sheet game-sheet" id="game-sheet" aria-labelledby="gs-title"></dialog>
  <dialog class="sheet" id="account-sheet" aria-labelledby="acct-title"></dialog>

  <script type="module" src="/src/library.js"></script>
</body>
</html>
